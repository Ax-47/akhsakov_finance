[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
types = { workspace = true }
dtos = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"]  }
rust_decimal = { version = "1", features = ["serde"]  }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal_macros = "1"
futures = {workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] , optional = true }
thiserror = { workspace = true  }
yfinance-rs ={ workspace = true, features = ["stream"], optional = true }
async-trait ={ workspace = true, optional = true }
tracing = {workspace = true, optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
# The version yfinance-rs uses, for a custom HTTP client.
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "deflate"], optional = true }
[features]
server = ["dioxus/server","dep:tokio","dep:yfinance-rs","dep:async-trait","dep:futures","dep:tracing","dep:rusqlite","dep:reqwest"]
